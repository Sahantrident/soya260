<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat with Soya · 260 Brands</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#F5F6F8;--surface:#fff;--sunk:#ECEEF2;--line:#DCE0E6;--fg:#1A1D23;--muted:#5A6170;--accent:#D9661A;--accent-soft:#FCEBDD;--accent-ink:#8F3E08;--ms:#0F6CBD;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#111317;--surface:#1A1D23;--sunk:#22262E;--line:#2E333C;--fg:#ECEEF1;--muted:#A2A9B6;--accent:#F08A3C;--accent-soft:#3A2516;--accent-ink:#FFC28F;--ms:#5AA9F2;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px}
.logo{background:#fff;border-radius:9px;padding:3px 8px;border:1px solid var(--line);display:flex}
.logo img{height:34px;width:auto;display:block}
header .t{display:flex;flex-direction:column;line-height:1.2}
header b{font-family:var(--display);font-size:18px}
header span{font-size:12.5px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-left)) 12px}
.inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.welcome{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,var(--accent-soft),var(--sunk));border-radius:18px;padding:16px}
.welcome svg{width:90px;height:98px;flex:none;animation:bob 3.4s ease-in-out infinite}
.welcome h1{font-family:var(--display);font-size:22px;margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg .av{width:36px;height:39px;flex:none}
.msg.me{justify-content:flex-end}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0;max-width:85%;overflow-wrap:anywhere}
.me .bubble{background:var(--accent);border-color:var(--accent);color:#fff}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.bubble ul,.bubble ol{margin:4px 0 8px;padding-left:20px}
.bubble pre{background:var(--sunk);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:6px 0;position:relative}
.bubble code{font-family:var(--mono);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:5px}
.bubble pre code{background:none;padding:0}
.cp{position:absolute;top:6px;right:6px;font:inherit;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:3px 8px;cursor:pointer}
.typing{color:var(--muted);font-style:italic}
footer{padding:10px max(16px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
form{max-width:760px;margin:0 auto;display:flex;gap:8px}
textarea{flex:1;font:inherit;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--fg);max-height:140px}
textarea:focus,button:focus-visible{outline:2px solid var(--ms);outline-offset:1px}
.send{font:inherit;font-weight:700;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 18px;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.note{max-width:760px;margin:6px auto 0;font-size:11.5px;color:var(--muted);text-align:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.welcome svg{animation:none}}
</style>
</head>

  <div class="t"><b>Soya</b><span>Your Microsoft 365 Copilot coach</span></div>
</header>

<main id="scroll"><div class="inner" id="log">
  <div class="welcome">
    <svg viewBox="0 0 120 130" role="img" aria-label="Soya"><use href="#soya"/></svg>
    <div><h1>Hi, I'm Soya!</h1><p>Tell me a task you do every day and I'll show you how Copilot can do it faster, with a prompt you can copy.</p></div>
  </div>
  <div class="chips" id="chips">
    <button type="button">How do I clear my approval emails faster?</button>
    <button type="button">Write me a prompt for the PAYE recon in Excel</button>
    <button type="button">How do I get meeting minutes from Teams?</button>
    <button type="button">My prompt "summarise emails" gave a bad answer. Why?</button>
  </div>
</div></main>

<footer>
  <form id="f">
    <label for="q" style="position:absolute;left:-9999px">Your question</label>
    <textarea id="q" rows="1" placeholder="Ask Soya about Copilot…" maxlength="1500"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <p class="note">Soya can make mistakes. Check important answers. Don't share passwords, bank details or confidential figures.</p>
</footer>

<script>
/* Paste your Function App URL here, e.g. https://soya-260-chat.azurewebsites.net */
const API_BASE = "https://YOUR-FUNCTION-APP.azurewebsites.net";
const log=document.getElementById("log"), scroll=document.getElementById("scroll"), q=document.getElementById("q"), send=document.getElementById("send");
let conv=null; try{conv=sessionStorage.getItem("soya-conv")}catch(e){}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(t){
  const blocks=[]; t=t.replace(/```[a-z]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(c.trim());return `\u0000${blocks.length-1}\u0000`});
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h=h.split(/\n{2,}/).map(p=>{
    const lines=p.split("\n");
    if(lines.every(l=>/^\s*[-*] /.test(l))) return "<ul>"+lines.map(l=>"<li>"+l.replace(/^\s*[-*] /,"")+"</li>").join("")+"</ul>";
    if(lines.every(l=>/^\s*\d+[.)] /.test(l))) return "<ol>"+lines.map(l=>"<li>"+l.replace(/^\s*\d+[.)] /,"")+"</li>").join("")+"</ol>";
    return "<p>"+lines.join("<br>")+"</p>";
  }).join("");
  return h.replace(/<p>\u0000(\d+)\u0000<\/p>|\u0000(\d+)\u0000/g,(_,a,b)=>`<pre><button type="button" class="cp">Copy</button><code>${esc(blocks[a??b])}</code></pre>`);
}
function add(role,html){
  const d=document.createElement("div"); d.className="msg "+(role==="me"?"me":"bot");
  d.innerHTML=(role==="me"?"":`<svg class="av" viewBox="0 0 120 130" aria-hidden="true"><use href="#soya"/></svg>`)+`<div class="bubble">${html}</div>`;
  log.appendChild(d); scroll.scrollTop=scroll.scrollHeight; return d.querySelector(".bubble");
}
log.addEventListener("click",e=>{
  const b=e.target.closest(".cp"); if(!b) return;
  const t=b.nextElementSibling.textContent;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1400)}).catch(()=>{});
});
document.getElementById("chips").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) ask(b.textContent)});
async function ask(text){
  text=text.trim(); if(!text||send.disabled) return;
  add("me",esc(text)); q.value=""; send.disabled=true;
  const out=add("bot",'<span class="typing">Soya is thinking…</span>');
  try{
    const r=await fetch(API_BASE+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,conversationId:conv})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||"Something went wrong.");
    out.innerHTML=md(j.reply); conv=j.conversationId||conv; try{sessionStorage.setItem("soya-conv",conv)}catch(e){}
  }catch(err){ out.innerHTML=`<p>${esc(err.message)}</p>`; }
  send.disabled=false; q.focus(); scroll.scrollTop=scroll.scrollHeight;
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();ask(q.value)});
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(q.value)}});
q.addEventListener("input",()=>{q.style.height="auto";q.style.height=Math.min(q.scrollHeight,140)+"px"});
</script>
</body>
