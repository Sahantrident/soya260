<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>260 Brands Copilot Playbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a small multi-view playbook — Home (shared story), Organisation, Department pages, and Personal pages with sub-tabs. Each view has its own link. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#ECEEF2; --line:#DCE0E6;
  --fg:#1A1D23; --muted:#5A6170;
  --accent:#D9661A; --accent-soft:#FCEBDD; --accent-ink:#8F3E08;
  --ms:#0F6CBD; --ms-soft:#E3EEF9;
  --good:#1E7F4F; --good-soft:#DFF3E8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --sunk:#22262E; --line:#2E333C;
  --fg:#ECEEF1; --muted:#A2A9B6;
  --accent:#F08A3C; --accent-soft:#3A2516; --accent-ink:#FFC28F;
  --ms:#5AA9F2; --ms-soft:#16283B;
  --good:#58C98C; --good-soft:#15291F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --sunk:#22262E; --line:#2E333C;
  --fg:#ECEEF1; --muted:#A2A9B6;
  --accent:#F08A3C; --accent-soft:#3A2516; --accent-ink:#FFC28F;
  --ms:#5AA9F2; --ms-soft:#16283B;
  --good:#58C98C; --good-soft:#15291F; color-scheme:dark }

*{box-sizing:border-box}
html{color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:26px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:800;line-height:1.06}
h2{font-size:clamp(21px,2.8vw,26px);font-weight:700}
h3{font-size:16.5px;font-weight:700}
p{margin:0}
a{color:var(--ms)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
section{margin-top:44px}
.sec-head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;max-width:72ch}
button{font:inherit}
:focus-visible{outline:2px solid var(--ms);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;color:var(--fg)}
.logo-slot{display:flex;align-items:center;justify-content:center;min-width:96px;height:38px;padding:4px 10px;border:1.5px dashed var(--line);border-radius:9px;background:var(--surface);font-size:11px;color:var(--muted);position:relative;cursor:pointer;text-align:center;line-height:1.2}
.logo-slot.filled{border-style:solid;border-color:transparent;background:#fff}
.logo-slot img{max-height:30px;max-width:130px;display:block}
.logo-slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav button{border:0;background:none;color:var(--fg);font-weight:600;font-size:14px;padding:7px 12px;border-radius:9px;cursor:pointer}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink)}

/* view header */
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbs button{border:0;background:none;color:var(--ms);cursor:pointer;padding:0;font-weight:600;font-size:13px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:10px}
.vh .l{display:flex;flex-direction:column;gap:8px;max-width:70ch;min-width:0}
.open-new{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;text-decoration:none;color:var(--ms);border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:12.5px}
.meta{display:flex;gap:8px;flex-wrap:wrap}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:end}
.lead{font-size:17.5px;max-width:58ch}
.facil{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px}
.facil b{font-family:var(--display);font-size:18px}
.stat-row{margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .n{font-family:var(--display);font-size:27px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.journey{overflow-x:auto;padding-bottom:6px}
.journey ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(150px,1fr));min-width:1080px;counter-reset:j}
.journey li{padding-right:10px;counter-increment:j}
.journey .dot{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.journey .dot::before{content:counter(j);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;flex:none}
.journey .dot::after{content:"";height:2px;flex:1;background:var(--line)}
.journey li:last-child .dot::after{display:none}
.journey .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:146px;display:flex;flex-direction:column;gap:6px}
.journey .card h3{font-size:15px}
.journey .pain{font-size:13px;color:var(--muted)}
.journey .who{font-size:12px;font-weight:600;color:var(--accent-ink);margin-top:auto}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.idea .big{font-family:var(--display);font-size:19px;font-weight:700}
.formula{margin-top:14px;background:var(--ms-soft);border-radius:14px;padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.formula div{display:flex;flex-direction:column;gap:4px}
.formula b{font-family:var(--display);font-size:17px;color:var(--ms)}
.formula span{font-size:13px}
.formula .ex{grid-column:1/-1;font-family:var(--mono);font-size:13px;background:var(--surface);border-radius:10px;padding:12px;border:1px solid var(--line)}
.agenda{display:grid;gap:8px}
.act{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.act .t{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.act b{font-family:var(--display);font-size:16px}
.act p{font-size:13.5px;color:var(--muted)}
.act .tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.act.brk{background:transparent;border-style:dashed}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.rule b{font-family:var(--display);font-size:15px}

/* directory tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.tile:hover{border-color:var(--accent)}
.tile .nm{font-family:var(--display);font-weight:700;font-size:17px}
.tile .rl{font-size:13px;color:var(--muted)}
.tile .ct{font-size:12px;font-weight:700;color:var(--accent-ink);margin-top:auto}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-family:var(--display);font-size:14px}
.tile.org{background:var(--accent);border-color:var(--accent);color:#fff}
.tile.org .rl,.tile.org .ct{color:#fff;opacity:.9}

/* scenario cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sc.org{border:2px solid var(--accent)}
.sc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tool{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ms-soft);color:var(--ms);white-space:nowrap}
.lvl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.lvl.Organisation{background:var(--accent);color:#fff}
.lvl.Department{background:var(--accent-soft);color:var(--accent-ink)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba div{border-radius:10px;padding:10px;font-size:13.5px}
.ba .before{background:var(--sunk)}
.ba .after{background:var(--good-soft)}
.ba b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.ba .before b{color:var(--muted)}
.ba .after b{color:var(--good)}
.prompt{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word}
.copy{font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:5px 10px;cursor:pointer}
.sc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tags button{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);border:0;cursor:pointer}
.saved{font-size:12.5px;color:var(--good);font-weight:700}
.done{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.done input{accent-color:var(--good);width:16px;height:16px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow span{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13px;padding:7px 11px;border-radius:9px}
.flow i{font-style:normal;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.facts div{background:var(--sunk);border-radius:10px;padding:11px;font-size:13.5px}
.facts b{display:block;font-family:var(--display);margin-bottom:3px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.group-h .muted{font-size:13px}

/* person */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:22px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.ph{display:flex;gap:14px;align-items:center}
.ph .avatar{width:56px;height:56px;font-size:20px}
.friction{display:grid;gap:8px}
.friction li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:600}
.friction{padding:0;margin:0}
.start{background:var(--accent-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.start b{font-family:var(--display);font-size:18px;color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plist{display:grid;gap:10px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.prow .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.week .wk{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.week b{font-family:var(--display);font-size:15px}
.week button{align-self:flex-start;border:0;background:none;color:var(--ms);font-weight:700;font-size:12.5px;padding:0;cursor:pointer}
.commit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.commit label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.commit select,.commit input{font:inherit;font-weight:500;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.commit .out{grid-column:1/-1;font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kv .n{font-family:var(--display);font-size:24px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.kv .l{font-size:12.5px;color:var(--muted)}
footer{margin-top:56px;padding-top:18px;padding-bottom:96px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* chat button */
.chat-cta{display:inline-block;margin-top:8px;font-weight:700;font-size:12.5px;background:var(--accent);color:#fff;text-decoration:none;padding:6px 10px;border-radius:8px}

/* fixed logos */
.logo-chip{display:flex;align-items:center;height:46px;padding:3px 10px;background:#fff;border-radius:10px;border:1px solid var(--line)}
.logo-chip img{display:block;height:auto;max-height:40px;width:auto}
.x-sep{font-family:var(--display);font-size:18px;color:var(--muted)}
@media (max-width:520px){.logo-chip{height:40px;padding:3px 8px}.logo-chip img{max-height:32px}}

/* demo lab */
.steps{margin:4px 0 0;padding-left:18px;display:grid;gap:3px}
.next{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.nx{font-size:12px;font-weight:700;border:1px dashed var(--accent);background:transparent;color:var(--accent-ink);border-radius:8px;padding:4px 9px;cursor:pointer}
.runrow{width:100%;text-align:left;color:var(--fg);cursor:pointer;font:inherit}
.runrow:hover{border-color:var(--accent)}
.tabs{overflow-x:auto;flex-wrap:nowrap}
.tabs button{white-space:nowrap}

/* 3D icons + mascot */
.ico{width:44px;height:44px;flex:none;filter:drop-shadow(0 5px 6px rgba(20,24,40,.22))}
.ico.sm{width:30px;height:30px;filter:drop-shadow(0 3px 4px rgba(20,24,40,.2))}
.ico.lg{width:58px;height:58px}
.ihead{display:flex;gap:12px;align-items:center;min-width:0}
.mascot{display:block;width:120px;height:130px;flex:none}
.hero-side{display:flex;flex-direction:column;align-items:center;gap:10px}
.hero-side .mascot{width:150px;height:162px;animation:bob 3.4s ease-in-out infinite}
.hero-side .facil{width:100%}
.soya-card{display:flex;gap:18px;align-items:center;background:linear-gradient(120deg,var(--accent-soft),var(--ms-soft));border-radius:18px;padding:16px 20px;margin-top:36px}
.soya-card .mascot{width:86px;height:93px;animation:bob 3.4s ease-in-out infinite}
.soya-card b{font-family:var(--display);font-size:18px;display:block;margin-bottom:2px}
.buddy{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:flex-end;gap:8px;max-width:calc(100vw - 28px)}
.buddy .bubble{max-width:250px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:10px 30px 10px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.14);position:relative}
.buddy .bubble b{display:block;font-family:var(--display);font-size:13.5px;color:var(--accent-ink)}
.buddy .x{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1}
.buddy .me{border:0;background:none;padding:0;cursor:pointer}
.buddy .me .mascot{width:70px;height:76px;animation:bob 3.4s ease-in-out infinite}
.buddy.min .bubble{display:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none!important}}

@media (max-width:860px){
  .hero,.two{grid-template-columns:1fr}
  .stat-row,.weeks{grid-template-columns:repeat(2,1fr)}
  .three,.rules,.facts{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:1fr}
  .formula{grid-template-columns:1fr 1fr}
  .nav{margin-left:0}
}
@media (max-width:520px){
  .three,.rules,.facts,.ba,.formula,.weeks,.commit,.kv{grid-template-columns:1fr}
  .act{grid-template-columns:1fr}
  .stat-row{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB46A"/><stop offset="1" stop-color="#E0651A"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72BCFF"/><stop offset="1" stop-color="#1F6FE0"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72DE9E"/><stop offset="1" stop-color="#1F9D57"/></linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDA4FF"/><stop offset="1" stop-color="#6A4BE0"/></linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74E6DB"/><stop offset="1" stop-color="#13A39A"/></linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27E"/><stop offset="1" stop-color="#F0A50E"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9191"/><stop offset="1" stop-color="#DE4646"/></linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A5B2C8"/><stop offset="1" stop-color="#55627A"/></linearGradient>
    <linearGradient id="gBean" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset=".55" stop-color="#F8C25A"/><stop offset="1" stop-color="#E8932A"/></linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8BE07A"/><stop offset="1" stop-color="#2E9D57"/></linearGradient>
    <radialGradient id="gBadge" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FF9A52"/><stop offset="1" stop-color="#C9530F"/></radialGradient>
  </defs>

(function buildSprite(){
  const ns="http://www.w3.org/2000/svg";
  const sp=document.querySelector("svg[aria-hidden] defs").parentNode;
  let out="";
  for(const [id,[g,glyph,detail]] of Object.entries(ICONS)){
    out+=`<symbol id="i-${id}" viewBox="0 0 64 64">
      <rect x="4" y="7" width="56" height="53" rx="16" fill="${DARK[g]}"/>
      <rect x="4" y="4" width="56" height="52" rx="16" fill="url(#g${g})"/>
      <rect x="9" y="7" width="46" height="17" rx="9" fill="#fff" opacity=".22"/>
      <g transform="translate(0 2.2)" fill="#000" stroke="#000" opacity=".2">${glyph}</g>
      <g fill="#fff" stroke="#fff">${glyph}</g>${detail}</symbol>`;
  }
  sp.insertAdjacentHTML("beforeend",out);
})();

function toolIcon(t){
  t=t.toLowerCase();
  if(t.includes("studio")||t.includes("agent builder")) return "agent";
  if(t.includes("outlook")) return "inbox";
  if(t.includes("excel")||t.includes("analyst")) return "excel";
  if(t.includes("teams")) return "meeting";
  if(t.includes("lists")||t.includes("power automate")||t.includes("loop")) return "flow";
  if(t.includes("sharepoint")) return "shield";
  if(t.includes("word")||t.includes("pages")||t.includes("notebook")) return "doc";
  if(t.includes("scheduled")) return "calendar";
  return "chat";
}

function whoTags(list){

  return `<span class="tags">${list.map(id=>`<button type="button" data-go="p-${id}">${person(id).short}</button>`).join("")}</span>`;
}
function card(s){
  const lvl=s.level||"User";
  const flow=s.flow?`<div class="flow">${s.flow.map(f=>`<span>${f}</span>`).join("<i>→</i>")}</div>
    <div class="facts"><div><b>Built with</b>${s.tool}</div><div><b>Value to 260 Brands</b>${s.value}</div><div><b>Guardrails</b>${s.guard}</div></div>`:"";
  return `<article class="sc ${lvl==="Organisation"?"org":""}">
    <div class="sc-top"><div class="ihead">${icon(lvl==="Organisation"?"org":toolIcon(s.tool))}<h3><span class="muted" style="font-family:var(--mono);font-size:13px">${s.code}</span>&nbsp; ${s.title}</h3></div>
      <span class="badges"><span class="lvl ${lvl}">${lvl}</span><span class="tool">${s.tool.split(" + ")[0]}</span></span></div>
    <div class="ba"><div class="before"><b>Today</b>${s.before}</div><div class="after"><b>With Copilot</b>${s.after}</div></div>
    ${flow}
    <div class="prompt">${esc(s.prompt)}</div>
    <div class="sc-foot">
      <button type="button" class="copy" data-p="${esc(s.prompt)}">Copy prompt</button>
      <span class="saved">≈ ${s.save}</span>
      <label class="done"><input type="checkbox" id="done-${s.code}" data-code="${s.code}" ${done[s.code]?"checked":""}> Tried it</label>
    </div>
    ${whoTags(s.who)}
  </article>`;
}
function grouped(items){
  return ["Organisation","Department","User"].map(l=>{
    const g=items.filter(s=>(s.level||"User")===l); if(!g.length) return "";
    const lab={Organisation:"Organisation level",Department:"Department level",User:"Personal level"}[l];
    const sub={Organisation:"Company-wide builds that need a leadership decision",Department:"Shared by the team: trackers, agents and checklists",User:"You can do these yourself, starting tomorrow"}[l];
    return `<div class="group-h"><h2 style="font-size:20px">${lab}</h2><span class="muted">${sub} · ${g.length}</span></div><div class="cards">${g.map(card).join("")}</div>`;
  }).join("");
}

  const orgs=ORG.filter(o=>o.who.some(w=>members.some(m=>m.id===w))).map(o=>({...o,level:"Organisation"}));
  return `${crumbs([{label:"Home",go:"home"},{label:"Departments",go:"departments"},{label:d.short}])}
  <div class="vh"><div class="l"><div class="ihead">${icon(DEPT_ICON[id],"lg")}<div class="eyebrow">Department</div></div><h1>${d.name}</h1><p class="lead muted">${d.blurb}</p></div>${openLink("d-"+id)}</div>
  <section style="margin-top:22px"><div class="two">
    <div><h3 style="margin-bottom:10px">Where time gets lost today</h3><ul class="friction">${d.frictions.map(f=>`<li>${f}</li>`).join("")}</ul></div>
    <div><h3 style="margin-bottom:10px">People in this department</h3><div class="tiles">${members.map(p=>`<button type="button" class="tile" data-go="p-${p.id}"><span class="avatar">${initials(p.name)}</span><span class="nm">${p.short}</span><span class="rl">${p.role}</span><span class="ct">Open personal page →</span></button>`).join("")}</div></div>
  </div></section>
  <section>${grouped(items.concat(orgs))}</section>
  <section><div class="group-h"><h2 style="font-size:20px">Plus the three everyday habits</h2><span class="muted">Everyone starts here</span></div><div class="cards">${SC.filter(s=>s.dept==="everyone").map(card).join("")}</div></section>`;
}

function vPeople(){
  return `${crumbs([{label:"Home",go:"home"},{label:"People"}])}
  <div class="vh"><div class="l"><div class="eyebrow">Personal pages</div><h1>Find your name</h1><p class="lead muted">Your page has four parts: an overview, your use cases by level, your prompts in one place, and your 30-day plan.</p></div>${openLink("people")}</div>
  <section style="margin-top:20px"><div class="tiles">${PEOPLE.map(p=>`<button type="button" class="tile" data-go="p-${p.id}"><span class="avatar">${initials(p.name)}</span><span class="nm">${p.name}</span><span class="rl">${p.role}</span><span class="ct">${forPerson(p.id).length} use cases →</span></button>`).join("")}</div></section>`;
}

const TABS=[["overview","Overview"],["usecases","My use cases"],["prompts","My prompts"],["plan","My 30 days"]];
function vPerson(id,tab){
  const p=person(id); if(!p) return vPeople();
  tab=TABS.some(t=>t[0]===tab)?tab:"overview";
  const items=forPerson(id);
  const start=items.find(s=>s.code===p.start)||items[0];
  const counts=["User","Department","Organisation"].map(l=>items.filter(s=>(s.level||"User")===l).length);
  const d=dept(p.dept);
  let body="";
  if(tab==="overview"){
    body=`<section style="margin-top:22px"><div class="kv">
      <div><div class="n">${counts[0]}</div><div class="l">personal use cases</div></div>
      <div><div class="n">${counts[1]}</div><div class="l">department use cases</div></div>
      <div><div class="n">${counts[2]}</div><div class="l">organisation builds you're part of</div></div></div></section>
    <section><div class="two">
      <div><h3 style="margin-bottom:10px">What slows you down today</h3><ul class="friction">${p.frictions.map(f=>`<li>${f}</li>`).join("")}</ul></div>
      <div class="start"><span class="eyebrow">Start here</span><b>${start.code} · ${start.title}</b><p>${start.after}</p>
        <div class="prompt">${esc(start.prompt)}</div><div class="sc-foot"><button type="button" class="copy" data-p="${esc(start.prompt)}">Copy prompt</button><span class="saved">≈ ${start.save}</span></div></div>
    </div></section>`;
  } else if(tab==="usecases"){
    body=`<section style="margin-top:6px">${grouped(items)}</section>`;
  } else if(tab==="prompts"){
    body=`<section style="margin-top:22px"><div class="sec-head"><h2 style="font-size:20px">All your prompts in one place</h2><p class="muted">Copy, paste into Copilot, and change the words in [brackets].</p></div>
      <div class="plist">${items.map(s=>`<div class="prow"><div class="hd"><span class="ihead">${icon((s.level==="Organisation")?"org":toolIcon(s.tool),"sm")}<b>${s.code} · ${s.title}</b></span><span class="badges"><span class="lvl ${s.level||"User"}">${s.level||"User"}</span><span class="tool">${s.tool.split(" + ")[0]}</span></span></div>
        <div class="prompt">${esc(s.prompt)}</div><div class="sc-foot"><button type="button" class="copy" data-p="${esc(s.prompt)}">Copy prompt</button><span class="saved">≈ ${s.save}</span></div></div>`).join("")}</div></section>`;
  } else {
    const dl=items.find(s=>s.level==="Department");
    const og=items.find(s=>s.level==="Organisation");
    const weeks=[
      ["Week 1","Build the morning habit",SC[0]],
      ["Week 2","Use your start-here every time",start],
      ["Week 3","Share it with your team",dl||SC[2]],
      ["Week 4","Join the pilot",og||SC[1]]
    ];
    body=`<section style="margin-top:22px"><div class="weeks">${weeks.map(w=>`<div class="week"><span class="wk">${w[0]}</span><b>${w[1]}</b><p style="font-size:13.5px">${w[2].code} · ${w[2].title}</p><button type="button" data-copy="${esc(w[2].prompt)}">Copy prompt</button></div>`).join("")}</div>
      <form class="commit" id="commitForm">
        <label for="c-fix">The use case I'll use every week<select id="c-fix">${items.map(s=>`<option value="${s.code}" ${s.code===start.code?"selected":""}>${s.code} · ${s.title}</option>`).join("")}</select></label>
        <label for="c-metric">How I'll measure it<input id="c-metric" type="text" value="Minutes saved per week"></label>
        <div class="out"><span id="c-out"></span><button type="button" class="copy" id="c-copy">Copy for the chat</button></div>
      </form></section>`;
  }
  return `${crumbs([{label:"Home",go:"home"},{label:"People",go:"people"},{label:p.short}])}
  <div class="vh"><div class="l"><div class="ph"><span class="avatar">${initials(p.name)}</span><div><h1 style="font-size:clamp(26px,4vw,38px)">${p.name}</h1><p class="muted">${p.role} · <button type="button" class="tags" style="all:unset;color:var(--ms);font-weight:700;cursor:pointer" data-go="d-${d.id}">${d.short}</button></p></div></div></div>
    ${openLink("p-"+id+(tab==="overview"?"":"--"+tab))}</div>
  <div class="tabs" role="tablist">${TABS.map(t=>`<button type="button" role="tab" aria-selected="${t[0]===tab}" data-go="p-${id}--${t[0]}">${t[1]}</button>`).join("")}</div>
  ${body}`;
}

/* ---------- router ---------- */
let current="home";
function render(token, push){
  token=token||"home"; current=token;
  let html, navKey="home";
  if(token==="home") html=vHome();
  else if(token==="demo"||token.startsWith("demo--")){html=vDemo(token.split("--")[1]);navKey="demo"}
  else if(token==="org"){html=vOrg();navKey="org"}
  else if(token==="departments"){html=vDepartments();navKey="departments"}
  else if(token==="people"){html=vPeople();navKey="people"}
  else if(token.startsWith("d-")){html=vDept(token.slice(2));navKey="departments"}
  else if(token.startsWith("p-")){const [id,tab]=token.slice(2).split("--");html=vPerson(id,tab);navKey="people"}
  else html=vHome();
  view.innerHTML=html;
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.go===navKey?"true":"false"));
  if(push){ try{ history.replaceState(null,"","#"+token) }catch(e){} window.scrollTo({top:0}); view.focus({preventScroll:true}); }
  wire();
}
function decorate(){
  const AG=["calendar","inbox","bolt","excel",null,"meeting","agent","org","target"];
  if(current==="home"){
    view.querySelectorAll(".act").forEach((a,i)=>{const c=a.children[1]; if(!AG[i]||!c) return;
      c.outerHTML=`<div class="ihead">${icon(AG[i],"sm")}<div>${c.innerHTML}</div></div>`;});
    const RU=["excel","search","lock","shield"];
    view.querySelectorAll(".rule").forEach((r,i)=>r.insertAdjacentHTML("afterbegin",icon(RU[i]||"bolt")));
  }
  /* Soya appears in a random spot on every view */
  const secs=[...view.querySelectorAll(":scope > section")];
  if(secs.length){
    const p=current.startsWith("p-")?person(current.slice(2).split("--")[0]):null;
    const lines=p?[`${p.short}, your quickest win is on the Overview tab under "Start here".`,`${p.short}, copy one prompt now and try it on your own inbox.`].concat(TIPS):TIPS;
    const at=secs[Math.floor(Math.random()*secs.length)];
    at.insertAdjacentHTML(Math.random()<.5?"beforebegin":"afterend",
      `<div class="soya-card">${mascot()}<div><b>Soya says</b><p>${pick(lines)}</p></div></div>`);
  }
}
function setBuddy(){
  const p=current.startsWith("p-")?person(current.slice(2).split("--")[0]):null;
  $("#buddy-tip").textContent = p && Math.random()<.5 ? `Hi ${p.short}! Start with your "Start here" use case today.` : pick(TIPS);
}
function wire(){
  decorate(); setBuddy();
  view.querySelectorAll(".copy[data-p]").forEach(b=>b.addEventListener("click",()=>copyText(b.dataset.p,b)));
  view.querySelectorAll("button[data-copy]").forEach(b=>b.addEventListener("click",()=>copyText(b.dataset.copy,b)));
  view.querySelectorAll(".done input").forEach(i=>i.addEventListener("change",()=>{
    done[i.dataset.code]=i.checked; try{localStorage.setItem("pb-done",JSON.stringify(done))}catch(e){}
    document.querySelectorAll(`.done input[data-code="${i.dataset.code}"]`).forEach(x=>x.checked=i.checked);
  }));
  const f=$("#commitForm");
  if(f){
    const p=person(current.slice(2).split("--")[0]);
    const out=()=>{const s=allItems().find(x=>x.code===$("#c-fix").value);
      $("#c-out").textContent=`${p.short}: for 30 days I'll use ${s.code} (${s.title}) and track "${$("#c-metric").value}".`};
    $("#c-fix").addEventListener("change",out); $("#c-metric").addEventListener("input",out);
    $("#c-copy").addEventListener("click",()=>copyText($("#c-out").textContent,$("#c-copy")));
    f.addEventListener("submit",e=>e.preventDefault()); out();
  }
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]"); if(!b) return;
  e.preventDefault(); render(b.dataset.go,true);
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(h&&h!==current) render(h,false)});

function copyText(t,btn){
  const ok=()=>{const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=o,1400)};
  try{navigator.clipboard.writeText(t).then(ok).catch(()=>fallback(t,btn,ok))}catch(e){fallback(t,btn,ok)}
}
function fallback(t,btn,ok){
  const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");ok()}catch(e){btn.textContent="Select and copy"}
  ta.remove();
}

/* logo slots */
function initLogo(key,inputId,slotId){
  const slot=$("#"+slotId), input=$("#"+inputId);
  const show=src=>{slot.classList.add("filled");slot.querySelector(".ph-l").innerHTML=`<img alt="" src="${src}">`};
  try{const s=localStorage.getItem(key); if(s) show(s)}catch(e){}
  input.addEventListener("change",()=>{
    const f=input.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{show(r.result); try{localStorage.setItem(key,r.result)}catch(e){}};
    r.readAsDataURL(f);
  });
}
if(SOYA_CHAT_URL){const c=$("#buddy-chat");c.href=SOYA_CHAT_URL;c.hidden=false;}
$("#buddy-x").addEventListener("click",()=>$("#buddy").classList.add("min"));
$("#buddy-me").addEventListener("click",()=>{$("#buddy").classList.remove("min");$("#buddy-tip").textContent=pick(TIPS)});


render((location.hash||"").slice(1)||"home",false);
</script>
